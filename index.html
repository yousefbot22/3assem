<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طرحتني | Tarhatny Store</title>

<!-- مكتبة الأيقونات -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!-- خط Cairo العربي -->
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

<style>
:root {
  /* الألوان الجديدة: زيتي وفانيليا */
  --olive-main: #3b4a1b; /* لون خلفية الموقع الزيتي */
  --olive-card: #2c3812; /* لون البطاقات والحاوية الزيتي الغامق */
  --vanilla: #f9f3e3;    /* لون النصوص الفانيليا لاتيه */
  --gold: #dcb336;       /* اللون الذهبي للزراير واللمسات */
  --gold-glow: rgba(220, 179, 54, 0.25);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Cairo', sans-serif;
}

body {
  min-height: 100vh;
  padding: 25px 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: 
    radial-gradient(circle at 10% 20%, rgba(220, 179, 54, 0.1), transparent 40%),
    radial-gradient(circle at 90% 80%, rgba(255, 255, 255, 0.05), transparent 40%),
    var(--olive-main);
  overflow-x: hidden;
}

.container {
  width: 100%;
  max-width: 550px;
  background: var(--olive-card);
  border: 2px solid var(--gold);
  border-radius: 30px;
  padding: 35px 25px;
  box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3), 0 0 20px var(--gold-glow);
  position: relative;
  overflow: hidden;
  color: var(--vanilla); /* جعل اللون الافتراضي للنصوص فانيليا */
}

/* تأثير الإضاءة الذهبية في الخلفية */
.container::before {
  content: "";
  position: absolute;
  top: -50px;
  right: -50px;
  width: 150px;
  height: 150px;
  background: var(--gold-glow);
  filter: blur(50px);
  border-radius: 50%;
  pointer-events: none;
}

.header {
  text-align: center;
  position: relative;
  z-index: 1;
}

/* تكبير صورة المحل */
.logo-icon {
  width: 180px; /* تم التكبير من 130px */
  height: 180px; /* تم التكبير من 130px */
  margin: 0 auto 20px;
  border-radius: 25px; 
  overflow: hidden; 
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 30px var(--gold-glow);
  border: 3px solid var(--gold);
}

.logo-icon img {
  width: 100%;
  height: 100%;
  object-fit: cover; 
}

h1 {
  font-size: 42px;
  font-weight: 900;
  color: var(--vanilla);
  letter-spacing: -1px;
  margin-bottom: 5px;
  text-shadow: 0 2px 10px rgba(0,0,0,0.3);
}

.tagline {
  color: var(--vanilla);
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 15px;
  opacity: 0.9;
}

.subtitle {
  display: inline-block;
  background: rgba(255, 255, 255, 0.08);
  color: var(--vanilla);
  padding: 8px 20px;
  border-radius: 30px;
  font-size: 13px;
  font-weight: 700;
  border: 1px solid var(--gold);
  margin-bottom: 15px;
}

/* عنوان القسم */
.section-title {
  color: var(--vanilla);
  font-size: 14px;
  font-weight: 800;
  margin-bottom: 15px;
  text-align: center;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}

.section-title::before,
.section-title::after {
  content: "";
  height: 1px;
  width: 40px;
  background: var(--gold);
}

.platform-grid {
  display: flex;
  flex-direction: column;
  gap: 12px;
  position: relative;
  z-index: 1;
}

/* البطاقات أصبحت زيتية أغمق قليلاً من الخلفية */
.platform-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 18px;
  background: rgba(255, 255, 255, 0.05); /* شفافية خفيفة جداً */
  border-radius: 18px;
  text-decoration: none;
  border: 1px solid rgba(255, 255, 255, 0.1);
  transition: all 0.3s ease;
}

.platform-card:hover {
  transform: translateY(-3px);
  border-color: var(--gold);
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
  background: rgba(255, 255, 255, 0.1);
}

.platform-name {
  display: flex;
  align-items: center;
  gap: 12px;
  color: var(--vanilla); /* النصوص فانيليا */
  font-size: 15px;
  font-weight: 700;
}

.platform-icon {
  width: 42px;
  height: 42px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 20px;
  flex-shrink: 0;
}

/* ألوان أيقونات السوشيال ميديا */
.facebook { background: #1877f2; }
.facebook-group { background: #4267B2; }
.instagram { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); }
.tiktok { background: #000000; }
.instapay { background: #6f2c91; }
.wallet { background: #e30613; }
.whatsapp { background: #25D366; }

/* الأزرار ذهبية والنص زيتي */
.btn-visit {
  padding: 8px 14px;
  border-radius: 20px;
  background: var(--gold); 
  color: var(--olive-card); 
  font-size: 12px;
  font-weight: 800;
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
  transition: 0.3s;
}

.platform-card:hover .btn-visit {
  background: var(--vanilla); 
  color: var(--olive-card); 
}

/* البانر السفلي فانيليا ونص زيتي */
.bottom-banner {
  margin-top: 25px;
  padding: 15px;
  border-radius: 18px;
  text-align: center;
  background: var(--vanilla); 
  color: var(--olive-card); 
  font-size: 14px;
  font-weight: 800;
  line-height: 1.8;
  box-shadow: 0 4px 15px rgba(0,0,0,0.2);
}

.bottom-banner i {
  margin: 0 5px;
}

.footer {
  text-align: center;
  margin-top: 25px;
  color: var(--vanilla);
  font-size: 12px;
  font-weight: 600;
  opacity: 0.8;
}

.footer span {
  color: var(--gold);
}

@media(max-width:400px) {
  .container { padding: 25px 15px; }
  .platform-card { padding: 10px 12px; }
  .platform-name { font-size: 13px; gap: 8px; }
  .platform-icon { width: 36px; height: 36px; font-size: 16px; }
  .btn-visit { padding: 6px 10px; font-size: 11px; }
  h1 { font-size: 34px; }
  .logo-icon { width: 150px; height: 150px; } /* تصغير بسيط للموبايل */
}
</style>
</head>
