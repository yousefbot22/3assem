<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طرحتي | Tarhaty Store</title>

<!-- مكتبة الأيقونات -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!-- خط Cairo العربي -->
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

<style>
:root {
  /* تم تخفيف الشفافية أكثر (0.35) ليظهر الخلفية بوضوح */
  --olive-card: rgba(35, 45, 15, 0.35); 
  --vanilla: #f9f3e3;    
  --gold: #dcb336;       
  --gold-glow: rgba(220, 179, 54, 0.4);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Cairo', sans-serif;
}

body {
  min-height: 100vh;
  min-height: 100dvh; /* لضمان التوافق مع شاشات الموبايل الحديثة */
  padding: 20px 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  /* تخفيف الطبقة الزيتية فوق الصورة */
  background: 
    linear-gradient(rgba(35, 45, 15, 0.4), rgba(35, 45, 15, 0.6)), 
    url('https://i.ibb.co/Fkwj22Bc/photo-2026-11-19-02-36-33.jpg'); 
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  overflow-x: hidden;
}

/* تصميم الكونتينر */
.container {
  width: 100%;
  max-width: 500px; /* تصغير العرض قليلاً ليكون متناسقاً */
  background: var(--olive-card);
  backdrop-filter: blur(16px); /* زيادة البلور لتعويض الشفافية */
  -webkit-backdrop-filter: blur(16px);
  border: 2px solid var(--gold);
  border-radius: 30px;
  padding: clamp(20px, 5vw, 35px) clamp(15px, 4vw, 25px); /* مسافات مرنة حسب حجم الشاشة */
  box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5), 0 0 20px var(--gold-glow);
  position: relative;
  overflow: hidden;
  color: var(--vanilla);
}

.header {
  text-align: center;
  position: relative;
  z-index: 1;
}

/* صورة المحل */
.logo-icon {
  width: clamp(130px, 40vw, 170px); /* عرض مرن حسب الشاشة */
  height: clamp(130px, 40vw, 170px);
  margin: 0 auto 15px;
  border-radius: 20px; 
  overflow: hidden; 
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 30px var(--gold-glow);
  border: 3px solid var(--gold);
  background: #000; 
}

.logo-icon img {
  width: 100%;
  height: 100%;
  object-fit: cover; 
}

h1 {
  font-size: clamp(30px, 8vw, 42px); /* حجم خط مرن */
  font-weight: 900;
  color: var(--vanilla);
  letter-spacing: -1px;
  margin-bottom: 5px;
  text-shadow: 0 2px 8px rgba(0,0,0,0.8); /* ظل قوي لضمان القراءة */
}

.tagline {
  color: var(--vanilla);
  font-size: clamp(14px, 4vw, 16px);
  font-weight: 700;
  margin-bottom: 15px;
  text-shadow: 0 1px 5px rgba(0,0,0,0.8);
}

.subtitle {
  display: inline-block;
  background: rgba(255, 255, 255, 0.1);
  color: var(--vanilla);
  padding: 6px 16px;
  border-radius: 30px;
  font-size: clamp(12px, 3.5vw, 14px);
  font-weight: 700;
  border: 1px solid var(--gold);
  margin-bottom: 15px;
  backdrop-filter: blur(5px);
  text-shadow: 0 1px 3px rgba(0,0,0,0.8);
}

/* عنوان القسم */
.section-title {
  color: var(--vanilla);
  font-size: clamp(13px, 3.5vw, 15px);
  font-weight: 800;
  margin-bottom: 15px;
  text-align: center;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  text-shadow: 0 1px 4px rgba(0,0,0,0.8);
}

.section-title::before,
.section-title::after {
  content: "";
  height: 1px;
  width: 30px;
  background: var(--gold);
}

.platform-grid {
  display: flex;
  flex-direction: column;
  gap: 12px;
  position: relative;
  z-index: 1;
}

/* البطاقات الداخلية */
.platform-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: clamp(10px, 3vw, 14px) clamp(12px, 3.5vw, 18px);
  background: rgba(255, 255, 255, 0.1);
  border-radius: 16px;
  text-decoration: none;
  border: 1px solid rgba(255, 255, 255, 0.15);
  transition: all 0.3s ease;
  backdrop-filter: blur(5px);
}

.platform-card:hover {
  transform: translateY(-3px);
  border-color: var(--gold);
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
  background: rgba(255, 255, 255, 0.2);
}

.platform-name {
  display: flex;
  align-items: center;
  gap: clamp(8px, 2vw, 12px);
  color: var(--vanilla);
  font-size: clamp(13px, 4vw, 15px);
  font-weight: 700;
  text-shadow: 0 1px 3px rgba(0,0,0,0.8);
}

.platform-icon {
  width: clamp(36px, 10vw, 42px);
  height: clamp(36px, 10vw, 42px);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: clamp(16px, 5vw, 20px);
  flex-shrink: 0;
}

/* ألوان أيقونات السوشيال ميديا */
.facebook { background: #1877f2; }
.facebook-group { background: #4267B2; }
.instagram { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); }
.tiktok { background: #000000; }
.instapay { background: #6f2c91; }
.wallet { background: #e30613; }
.whatsapp { background: #25D366; }

/* الأزرار */
.btn-visit {
  padding: clamp(6px, 2vw, 8px) clamp(10px, 3vw, 14px);
  border-radius: 20px;
  background: var(--gold); 
  color: #2c3812; 
  font-size: clamp(11px, 3vw, 12px);
  font-weight: 800;
  display: flex;
  align-items: center;
  gap: 5px;
  white-space: nowrap;
  transition: 0.3s;
}

.platform-card:hover .btn-visit {
  background: var(--vanilla); 
}

/* البانر السفلي */
.bottom-banner {
  margin-top: 20px;
  padding: clamp(12px, 3vw, 15px);
  border-radius: 16px;
  text-align: center;
  background: var(--vanilla); 
  color: #2c3812; 
  font-size: clamp(12px, 3.5vw, 14px);
  font-weight: 800;
  line-height: 1.6;
  box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}

.bottom-banner i {
  margin: 0 5px;
}

.footer {
  text-align: center;
  margin-top: 20px;
  color: var(--vanilla);
  font-size: clamp(11px, 3vw, 12px);
  font-weight: 600;
  text-shadow: 0 1px 3px rgba(0,0,0,0.8);
}

.footer span {
  color: var(--gold);
}

/* تعديلات إضافية للشاشات الصغيرة جداً (الموبايلات) */
@media (max-width: 380px) {
  .container {
    padding: 15px 10px;
  }
  .platform-card {
    padding: 8px 10px;
  }
  .btn-visit span {
    display: none; /* إخفاء كلمة "مراسلة/زيارة" على الشاشات الصغيرة جداً لتوفير المساحة */
  }
  .btn-visit i {
    margin: 0; /* إبقاء السهم فقط */
  }
}
</style>
</head>

<body>

<div class="container">

  <header class="header">
    
    <div class="logo-icon">
      <img src="https://i.ibb.co/HfddKKnZ/photo-2026-11-19-02-17-18.jpg" alt="محل طرحتني">
    </div>

    <h1>طرحتي</h1>

  <div class="section-title">

    <!-- دفع: فودافون كاش / فلوس -->

      <div class="platform-name">
        <div class="platform-icon wallet"><i class="fa-solid fa-wallet"></i></div>
        محفظة إلكترونية
      </div>
      <div class="btn-visit"><span>دفع</span> <i class="fa-solid fa-arrow-left"></i></div>

  </div>

  <div class="bottom-banner">
    <i class="fa-solid fa-crown"></i>
    أناقة · ترند
    <i class="fa-solid fa-crown"></i>
    <br>
    اختاري إطلالتك المفضلة الآن 💚
  </div>

  <div class="footer">
    صُنع بكل حب <span>♡</span> طرحتني
  </div>

</div>

</body>
</html>
